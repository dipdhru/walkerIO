version: '3.9'

# Walker.IO — Local development stack
# Usage: docker compose -f infrastructure/docker/docker-compose.yml up

services:

  # ── PostgreSQL + PostGIS ──────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: walkerio_postgres
    environment:
      POSTGRES_DB: walkerio
      POSTGRES_USER: walkerio
      POSTGRES_PASSWORD: walkerio_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walkerio -d walkerio"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: walkerio_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Backend API + WebSocket ────────────────────────────────────
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: builder  # use builder stage for dev (includes devDeps)
    container_name: walkerio_backend
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://walkerio:walkerio_dev_password@postgres:5432/walkerio
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_secret_change_in_production_at_least_32_chars
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      MAX_SPEED_KMH: 50
      MAX_VIOLATIONS_PER_SESSION: 3
      GPS_BATCH_INTERVAL_MS: 3000
      GPS_MIN_DISTANCE_METERS: 10
      GPS_MAX_BATCH_SIZE: 50
      MIN_POLYGON_AREA_M2: 100
      MAX_SESSION_AREA_M2: 10000000
      CORS_ORIGINS: http://localhost:8081,http://localhost:3001
    volumes:
      - ../../backend/src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Redis Commander (dev UI for Redis) ────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: walkerio_redis_ui
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    profiles:
      - debug

  # ── pgAdmin (dev UI for PostgreSQL) ───────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: walkerio_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@walkerio.app
      PGADMIN_DEFAULT_PASSWORD: dev_password
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - debug

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: walkerio_network
