apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: walkerio-ingress
  namespace: walkerio
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:ACCOUNT:certificate/CERT_ID"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # Sticky sessions — CRITICAL for WebSocket (Socket.IO uses long-lived connections)
    alb.ingress.kubernetes.io/target-group-attributes: "stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=86400"
    # Health check
    alb.ingress.kubernetes.io/healthcheck-path: "/health"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    # Compression
    alb.ingress.kubernetes.io/load-balancer-attributes: "compression.enabled=true"
spec:
  rules:
    - host: api.walkerio.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: walkerio-backend-svc
                port:
                  number: 80
